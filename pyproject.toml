# Install system library
[tool.cibuildwheel.macos]
# Run multiple commands using an array
before-all = [
  "brew install hdf5",
  "brew install boost",
  "brew install cmake",
  "brew install gsl",
]

[tool.cibuildwheel.linux]
before-all = [
  "yum install hdf5-devel -y",
  "yum install boost-devel -y",
  "yum install gsl-devel -y",
]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
before-all = "vcpkg install --triplet x64-windows"
before-build = "pip install delvewheel"
repair-wheel-command = "delvewheel repair --add-path {project}/vcpkg_installed/x64-windows/bin -w {dest_dir} {wheel}"

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = [
  "apk add gsl-dev",
  "apk add boost-dev",
  "apk add hdf5-dev",
]
