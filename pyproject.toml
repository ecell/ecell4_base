# Install system library
[tool.cibuildwheel.windows]
before-build-windows = [
    "if not exist C:\\vcpkg git clone https://github.com/microsoft/vcpkg.git C:\\vcpkg",
    "C:\\vcpkg\\bootstrap-vcpkg.bat",
    "C:\\vcpkg\\vcpkg.exe install hdf5:x64-windows",
    "setx VCPKG_ROOT C:\\vcpkg",
    "setx CMAKE_TOOLCHAIN_FILE C:\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake"
]
environment = { VCPKG_ROOT = "C:\\vcpkg", CMAKE_TOOLCHAIN_FILE = "C:\\vcpkg\\scripts\\buildsystems\\vcpkg.cmake" }

[tool.cibuildwheel.macos]
# Run multiple commands using an array
before-all = [
  "brew install hdf5",
  "brew install boost",
  "brew install gsl",
]

[tool.cibuildwheel.linux]
before-all = [
  "yum install hdf5-devel -y",
  "yum install boost-devel -y",
  "yum install gsl-devel -y",
]

[[tool.cibuildwheel.overrides]]
select = "*-musllinux*"
before-all = [
  "apk add gsl-dev",
  "apk add boost-dev",
  "apk add hdf5-dev",
]
